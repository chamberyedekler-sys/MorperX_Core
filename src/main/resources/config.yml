# =========================================================
# MORPERX CORE
# =========================================================

scoreboard:

  enabled: true

  title: "&b&lMORPERX"

  lines:

    - "&8&m----------------"
    - "&fOyuncu: &e%player%"
    - ""
    - "&fSunucu: &b%mode%"
    - "&fOnline: &a%online%&7/&f%max%"
    - ""
    - "&bdiscord.gg/morperx"
    - "&8&m----------------"


# =========================================================
# BOSSBAR
# =========================================================

bossbar:

  enabled: true

  announcement-interval: 10

  announcements:

    - "&b&lMORPERX &7» &fdiscord.gg/morperx"
    - "&d&lMORPERX &7» &ftiktok.gg/morperx"
    - "&a&lMORPERX &7» &fİyi eğlenceler!"
    - "&e&lMORPERX &7» &fSunucumuza hoş geldin!"

  join-message: "&a● &e%player% &fsunucuya katıldı!"

  quit-message: "&c● &e%player% &fsunucudan ayrıldı!"


# =========================================================
# JOIN / QUIT
# =========================================================

join-quit:

  enabled: true

  join: "&a+ &e%player% &7sunucuya katıldı."

  quit: "&c- &e%player% &7sunucudan ayrıldı."


# =========================================================
# TABLIST
# =========================================================

tablist:

  enabled: true

  header:

    - ""
    - "&b&lMORPERX"
    - "&7discord.gg/morperx"
    - ""

  footer:

    - ""
    - "&fSunucu: &b%mode%"
    - "&fOyuncular: &a%online%&7/&f%max%"
    - ""


# =========================================================
# LOCATIONS
# =========================================================

locations:

  # -------------------------------------------------------
  # LOBBY
  # -------------------------------------------------------

  lobby:

    world: "world"

    # Oyuncu platformun üzerinde doğacak.
    x: 0

    y: 101

    z: 0

    yaw: 0

    pitch: 0


  # -------------------------------------------------------
  # SURVIVAL
  # -------------------------------------------------------

  survival:

    world: "world"

    # Lobby'den uzakta ayrı alan.
    x: 300

    y: 101

    z: 0

    yaw: 0

    pitch: 0


  # -------------------------------------------------------
  # SKYBLOCK
  # -------------------------------------------------------

  skyblock:

    world: "world"

    # Adanın merkezi 0,180,0.
    # Oyuncu ağacın içine doğmasın diye
    # adanın kenarına gönderilecek.
    x: 5

    y: 181

    z: 5

    yaw: 225

    pitch: 0
